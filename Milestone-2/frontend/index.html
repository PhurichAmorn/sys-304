<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disaster Tweet Classifier</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --cyan: #00d9ff;
    --cyan-dim: rgba(0, 217, 255, 0.25);
    --red: #ff3b3b;
    --green: #00ff9d;
    --amber: #ffb800;
    --text: #d6e4ea;
    --text-dim: #6f8a96;
    --panel: rgba(16, 21, 28, 0.82);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  /* --- real basemap (MapLibre), recolored to the wireframe theme --- */
  #map {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  /* --- radar sweep + rings --- */
  .radar {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 1100px;
    height: 1100px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
  }
  .radar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--cyan-dim), transparent 30%);
    animation: spin 6s linear infinite;
    opacity: 0.5;
  }
  .radar-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    border: 1px solid var(--cyan-dim);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  @keyframes ping {
    0% { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  /* --- incident markers (reported emergencies on the map) --- */
  .incident {
    position: fixed;
    z-index: 1;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px 2px var(--red);
    pointer-events: none;
  }
  .incident::after {
    content: "";
    position: absolute;
    inset: -6px;
    border: 2px solid var(--red);
    border-radius: 50%;
    animation: ping 1.8s ease-out infinite;
  }

  /* --- moving unit markers (live-tracked emergency vehicles) --- */
  .unit-marker {
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  .unit-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px 2px var(--green);
  }
  .unit-label {
    margin-top: 3px;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    color: var(--green);
    background: rgba(10, 14, 20, 0.8);
    border: 1px solid var(--green);
    padding: 1px 5px;
    white-space: nowrap;
  }

  /* --- console panel --- */
  .console {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    backdrop-filter: blur(6px);
    padding: 28px 32px 32px;
  }

  .corner {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2px solid var(--amber);
  }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px 2px var(--red);
    animation: blink 1.6s infinite;
  }

  h1 {
    font-size: 1.1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: var(--text);
  }
  .subtitle {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin: 0 0 22px;
    letter-spacing: 0.05em;
  }

  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    height: 100px;
    resize: vertical;
    background: #060a0f;
    border: 1px solid var(--cyan-dim);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 10px 12px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--amber);
  }

  button {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    background: var(--amber);
    color: #0a0e14;
    border: none;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button:hover { background: #ffc933; }
  button:active { background: #e0a300; }

  #result { margin-top: 22px; min-height: 20px; }

  .banner {
    padding: 14px 16px;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: bold;
    border: 1px solid currentColor;
  }
  .banner.disaster {
    color: var(--red);
    background: rgba(255, 59, 59, 0.1);
    box-shadow: 0 0 16px rgba(255, 59, 59, 0.25);
    animation: blink 1.4s infinite;
  }
  .banner.not-disaster {
    color: var(--green);
    background: rgba(0, 255, 157, 0.08);
    box-shadow: 0 0 16px rgba(0, 255, 157, 0.2);
  }

  .meter-track {
    margin-top: 10px;
    height: 6px;
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
  }
  .meter-fill {
    height: 100%;
    background: currentColor;
  }
  .meter-label {
    margin-top: 6px;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .pending, .error {
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .pending { color: var(--cyan); }
  .error { color: var(--red); }
</style>
</head>
<body>

<div id="map"></div>


<div class="radar">
  <div class="radar-ring" style="width: 220px; height: 220px;"></div>
  <div class="radar-ring" style="width: 480px; height: 480px;"></div>
  <div class="radar-ring" style="width: 760px; height: 760px;"></div>
  <div class="radar-ring" style="width: 1060px; height: 1060px;"></div>
</div>

<div class="console">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="status-bar">
    <span class="status-dot"></span>
    DISPATCH ONLINE
  </div>

  <h1>Incident Classifier</h1>
  <p class="subtitle">Submit a report for automated threat assessment</p>

  <label for="text">Incoming Report</label>
  <textarea id="text" placeholder="Paste tweet text..."></textarea>
  <button id="submit">Analyze</button>

  <div id="result"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  // New York City, top-down, whole-city extent — recolored to the dispatch wireframe theme.
  const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    bounds: [[-74.03, 40.695], [-73.90, 40.885]],
    fitBoundsOptions: { padding: 0 },
    pitch: 0,
    bearing: 0,
    interactive: false,
    attributionControl: false,
  });

  map.on("load", () => {
    map.setZoom(map.getZoom() + 0.45);

    for (const layer of map.getStyle().layers) {
      const id = layer.id;
      try {
        if (layer.type === "background") {
          map.setPaintProperty(id, "background-color", "#0a0e14");
        } else if (layer.type === "raster") {
          map.setLayoutProperty(id, "visibility", "none");
        } else if (layer.type === "fill-extrusion") {
          map.setLayoutProperty(id, "visibility", "none");
        } else if (layer.type === "symbol") {
          map.setLayoutProperty(id, "visibility", "none");
        } else if (layer.type === "fill") {
          if (id === "water") {
            map.setPaintProperty(id, "fill-color", "#0d1922");
            map.setPaintProperty(id, "fill-opacity", 0.85);
          } else if (id === "building") {
            map.setPaintProperty(id, "fill-color", "rgba(0, 217, 255, 0.05)");
            map.setPaintProperty(id, "fill-outline-color", "#00d9ff");
          } else {
            map.setPaintProperty(id, "fill-opacity", 0);
          }
        } else if (layer.type === "line") {
          if (/_casing$|hatching/.test(id)) {
            map.setLayoutProperty(id, "visibility", "none");
            continue;
          }
          const isMotorway = /motorway/.test(id) && !/_link/.test(id);
          const isTrunkPrimary = /trunk_primary/.test(id);
          map.setPaintProperty(id, "line-color", isMotorway ? "#7cf3ff" : "#00d9ff");

          if (isTrunkPrimary) {
            // this layer bundles real trunk highways with ordinary primary avenues —
            // split them by the underlying OSM class so avenues don't out-shine the grid
            map.setPaintProperty(id, "line-opacity", ["match", ["get", "class"], "trunk", 0.85, "primary", 0.2, 0.35]);
          } else if (/_link/.test(id)) {
            map.setPaintProperty(id, "line-opacity", 0.12);
          } else if (isMotorway) {
            map.setPaintProperty(id, "line-opacity", 1);
          } else if (/secondary_tertiary/.test(id)) {
            map.setPaintProperty(id, "line-opacity", 0.15);
          } else if (/waterway/.test(id)) {
            map.setPaintProperty(id, "line-opacity", 0.4);
          } else if (/boundary/.test(id)) {
            map.setPaintProperty(id, "line-opacity", 0.15);
          } else if (/major_rail|transit_rail/.test(id)) {
            map.setPaintProperty(id, "line-opacity", 0.2);
          } else {
            map.setPaintProperty(id, "line-opacity", 0.06);
          }
        }
      } catch (e) {
        // some layers don't support every paint property — skip and move on
      }
    }

    // reported incidents — fixed real locations around Manhattan
    const incidentSpots = [
      [-73.9855, 40.7580], // Times Square
      [-74.0090, 40.7074], // Wall Street
      [-73.9465, 40.8116], // Harlem, 125th St
    ];
    for (const lngLat of incidentSpots) {
      const el = document.createElement("div");
      el.className = "incident";
      new maplibregl.Marker({ element: el }).setLngLat(lngLat).addTo(map);
    }

    // live unit tracking — each unit drives back and forth along a real Manhattan
    // street at a speed that matches how fast it could actually move there
    const METERS_PER_KMH = 1000 / 3600;
    function haversineMeters([lng1, lat1], [lng2, lat2]) {
      const R = 6371000;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function addUnit(label, start, end, speedKmh) {
      const distance = haversineMeters(start, end);
      const speed = speedKmh * METERS_PER_KMH;
      const legDuration = distance / speed; // seconds for one leg

      const el = document.createElement("div");
      el.className = "unit-marker";
      el.innerHTML = `<div class="unit-dot"></div><div class="unit-label">${label}</div>`;
      const marker = new maplibregl.Marker({ element: el, anchor: "bottom" })
        .setLngLat(start)
        .addTo(map);

      function frame(tMs) {
        const cycle = (tMs / 1000) % (legDuration * 2);
        const progress = cycle < legDuration ? cycle / legDuration : 2 - cycle / legDuration;
        marker.setLngLat([
          start[0] + (end[0] - start[0]) * progress,
          start[1] + (end[1] - start[1]) * progress,
        ]);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // 5th Avenue, 34th St to 59th St — ~40 km/h responding speed
    addUnit("EMS 4", [-73.9857, 40.7484], [-73.9731, 40.7644], 40);
    // 42nd St, 8th Ave to 3rd Ave — fire engine, slower through traffic
    addUnit("ENGINE 23", [-73.9908, 40.7563], [-73.9712, 40.7527], 28);
    // Broadway, 23rd St to 42nd St
    addUnit("PD 12", [-73.9903, 40.741], [-73.9857, 40.758], 45);
  });
</script>
<script src="app.js"></script>
<script>
  const API_URL = window.API_URL || "http://localhost:8000";

  document.getElementById("submit").addEventListener("click", async () => {
    const text = document.getElementById("text").value.trim();
    const result = document.getElementById("result");
    if (!text) return;
    result.innerHTML = '<div class="pending">ANALYZING...</div>';
    try {
      const data = await predictTweet(API_URL, text, fetch);
      const { label, cls, probability } = formatResult(data);
      const pct = Math.round(data.probability * 100);
      result.innerHTML = `
        <div class="banner ${cls}">${label}</div>
        <div class="meter-track"><div class="meter-fill" style="width:${pct}%; color: currentColor;"></div></div>
        <div class="meter-label">CONFIDENCE ${probability} (${pct}%)</div>
      `;
      result.querySelector(".meter-fill").style.color = cls === "disaster" ? "var(--red)" : "var(--green)";
    } catch (err) {
      result.innerHTML = `<div class="error">ERROR: ${err.message}</div>`;
    }
  });
</script>
</body>
</html>
